[pytest]
base_url = https://www.saucedemo.com
testpaths = tests --slowmo=1000
markers =
    smoke: quick sanity tests
    ui: browser tests
    api: API tests
addopts = --headed --browser chromium --tracing retain-on-failure --screenshot only-on-failure --video retain-on-failure --html=reports/report.html --self-contained-html
pythonpath = .